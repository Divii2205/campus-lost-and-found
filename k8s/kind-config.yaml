# a local kubernetes cluster that is a free stand in for eks while building the project
# ports 80 and 443 on the laptop go to the ingress nginx controller
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: session21
nodes:
  - role: control-plane
    # label the node so the ingress controller can run on it
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # open the web ports from the laptop into the cluster
    extraPortMappings:
      - { containerPort: 80, hostPort: 80, protocol: TCP }
      - { containerPort: 443, hostPort: 443, protocol: TCP }
