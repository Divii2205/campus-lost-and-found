# troubleshooting lab one
# the image tag does not exist so the pod shows errimagepull and then imagepullbackoff
# to look into it run kubectl get pods and then kubectl describe pod with the pod name
# both in the lostfound namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lostfound-broken-image
  namespace: lostfound
spec:
  replicas: 1
  selector:
    matchLabels: { app: broken-image }
  template:
    metadata:
      labels: { app: broken-image }
    spec:
      containers:
        - name: web
          # this tag was never built so the pull fails on purpose
          image: ghcr.io/divii2205/lostfound-frontend:does-not-exist
