# troubleshooting lab two
# the selector does not match any pod labels so the service has no endpoints
# to look into it run kubectl get endpoints and then kubectl get pods with show labels
# both in the lostfound namespace
apiVersion: v1
kind: Service
metadata:
  name: lostfound-broken-service
  namespace: lostfound
spec:
  selector:
    # this is wrong on purpose because the backend pods have the label lostfound backend
    app: lostfound-api
  ports:
    - port: 8000
      targetPort: 8000
