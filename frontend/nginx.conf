# nginx settings that serve the website and pass api calls to the backend
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # for any page send the main index file so the react app can handle it
  location / {
    try_files $uri /index.html;
  }

  # send api calls to the backend
  # docker compose and kubernetes both have a service named backend
  location /api/ {
    proxy_pass http://backend:8000;
    # pass along the original host and the address of the visitor
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
