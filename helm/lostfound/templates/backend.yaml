# the deployment runs the api pods
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
    {{- include "lostfound.labels" . | nindent 4 }}
spec:
  # when the hpa is on it picks the number of pods so we do not set it here
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-backend }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-backend }
      # restart the pods when the config changes
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # never run as the root user
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      # wait until postgresql takes connections so the migrations do not crash the container
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h {{ .Release.Name }}-postgres -p 5432 -U {{ .Values.postgres.username }}; do echo waiting for db; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: backend
          image: {{ include "lostfound.backendImage" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          # settings come from the config map and the database address comes from the secret
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-db, key: DATABASE_URL } }
          # the startup check gives the migrations and uvicorn up to 150 seconds before the liveness check starts
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          # the ready check takes the pod out of traffic when the database is not reachable
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          # the liveness check restarts the pod if the app stops answering
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
---
# the service is named backend because the frontend nginx sends api calls to the host backend on port 8000
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: {{ .Release.Name }}-backend
    {{- include "lostfound.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: {{ .Release.Name }}-backend }
  ports:
    - { name: http, port: 8000, targetPort: http }
