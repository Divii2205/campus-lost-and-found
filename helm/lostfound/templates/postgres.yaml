# ask the cluster for a disk to keep the database files
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgres-data
  labels: {{- include "lostfound.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
# one postgres database pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: {{ .Release.Name }}-postgres
    {{- include "lostfound.labels" . | nindent 4 }}
spec:
  replicas: 1
  # stop the old pod before starting a new one because only one pod may use the disk at a time
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: {{ .Release.Name }}-postgres }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: {{ .Release.Name }}-db }
          env:
            # keep the data in a folder inside the disk
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          # check that the database is ready for connections
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-postgres-data }
---
# a stable address for the database inside the cluster
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "lostfound.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: {{ .Release.Name }}-postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
