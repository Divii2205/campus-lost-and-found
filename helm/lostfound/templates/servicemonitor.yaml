{{- if and .Values.monitoring.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
# tells the prometheus operator to read the backend metrics page every 15 seconds
# it is only made when monitoring is on and the cluster knows about service monitors
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    release: {{ .Values.monitoring.serviceMonitor.releaseLabel }}
    {{- include "lostfound.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app: {{ .Release.Name }}-backend }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
