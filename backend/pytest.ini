# settings for running the tests with pytest
[pytest]
# let tests import the app folder
pythonpath = .
# look for tests in the tests folder
testpaths = tests
# show a short summary of skipped and failed tests
addopts = -ra
# hide warnings that are not useful
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using .httpx. with .starlette.testclient.
