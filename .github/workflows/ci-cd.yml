# Campus Lost & Found CI/CD
# test -> build images -> Trivy security gate -> push to GHCR (tag = commit SHA) -> Helm deploy
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.65.0

jobs:
  # 1. Quality gate: tests must pass before any image is built
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run pytest (a failing test fails the pipeline)
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # 2. Build both images, scan them with Trivy, push to GHCR
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image names (GHCR needs a lowercase owner)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=${REGISTRY}/${OWNER}/lostfound-backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${REGISTRY}/${OWNER}/lostfound-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build backend image
        run: docker build -t "$BACKEND_IMAGE" backend
      - name: Build frontend image
        run: docker build -t "$FRONTEND_IMAGE" frontend

      - name: Trivy scan backend image (fails on HIGH or CRITICAL)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$BACKEND_IMAGE"
      - name: Trivy scan frontend image (fails on HIGH or CRITICAL)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$FRONTEND_IMAGE"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images (tagged with the commit SHA, never latest)
        if: github.event_name == 'push'
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"

  # 3. Deploy with Helm. Runs only when a KUBE_CONFIG secret (e.g. for EKS) is set in the repo.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no cluster is configured
        if: env.KUBE_CONFIG == ''
        run: echo "No KUBE_CONFIG secret set - skipping deploy. Images are in GHCR."
      - uses: azure/setup-helm@v4
        if: env.KUBE_CONFIG != ''
      - name: helm upgrade --install
        if: env.KUBE_CONFIG != ''
        run: |
          mkdir -p ~/.kube && echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl apply -f k8s/namespace.yaml
          helm upgrade --install lostfound ./helm/lostfound -n lostfound \
            --set "backend.image=ghcr.io/${OWNER}/lostfound-backend" --set "backend.tag=${GITHUB_SHA}" \
            --set "frontend.image=ghcr.io/${OWNER}/lostfound-frontend" --set "frontend.tag=${GITHUB_SHA}" \
            --wait --timeout 5m
          kubectl rollout status deployment/lostfound-backend -n lostfound
          kubectl get pods -n lostfound
