# grafana settings inside the kube prometheus stack chart
grafana:
  enabled: true
  adminUser: admin
  # there is no admin password here
  # the chart makes one and keeps it in the kube prometheus stack grafana secret
  # so no passwords are saved in git
  # a helper that finds dashboards in config maps and loads them
  sidecar:
    dashboards:
      enabled: true
      # this label is how it finds our grafana dashboard file in the monitoring folder
      label: grafana_dashboard
      searchNamespace: ALL
  service:
    type: ClusterIP
